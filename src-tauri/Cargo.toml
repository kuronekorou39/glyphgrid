[package]
name = "glyphgrid"
version = "0.1.0"
description = "グリッド上のノード + エッジで統一デザインのアイコンを作るエディタ"
authors = ["rou39"]
license = "MIT"
repository = "https://github.com/kuronekorou39/glyphgrid"
homepage = "https://rou39.com"
edition = "2024"
rust-version = "1.90"

[lib]
name = "glyphgrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
notify = "8"
